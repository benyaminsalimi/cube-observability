name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: cd packages/cube-prometheus && npm ci --no-audit --no-fund
      - run: make test-unit

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: make tools
      - run: cd packages/cube-prometheus && npm ci --no-audit --no-fund
      - run: make test-gen
      - name: Contract against the Cube release the package claims
        run: |
          set -eu
          v="$(node -p "require('./packages/cube-prometheus/package.json').version")"
          git clone --depth 1 --branch "v${v}" https://github.com/cube-js/cube.git .cube
          make test-contract CUBE_REPO="$PWD/.cube"
      - run: make test-static

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make tools
      - run: make test-render

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: make e2e
