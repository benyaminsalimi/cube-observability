name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: cd packages/cube-prometheus && npm ci --no-audit --no-fund
      - run: make test-unit

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # The contract check needs a Cube checkout; pin it to the release under test.
      - uses: actions/checkout@v4
        with:
          repository: cube-js/cube
          ref: v1.8.25
          path: .cube
      - run: make tools
      - run: cd packages/cube-prometheus && npm ci --no-audit --no-fund
      - run: make test-gen
      - run: make test-contract CUBE_REPO=${{ github.workspace }}/.cube
      - run: make test-static

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make tools
      - run: make test-render

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: make e2e
