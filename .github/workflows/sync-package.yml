name: sync package

# Keeps packages/cube-prometheus pointed at the newest released tag of the package
# repository, then lets this repository's CI prove the pair works before anyone merges.
#
# Scheduled rather than triggered from the package repository on purpose: a release should
# never be able to push code into this repository without a reviewable commit here.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-package
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          # A PAT makes the push trigger normal CI on the pull request; with the default
          # token the suite below runs in this job instead.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Find the newest package tag
        id: tag
        run: |
          set -eu
          latest="$(git ls-remote --tags --refs \
            https://github.com/benyaminsalimi/cube-prometheus.git 'v*' \
            | awk '{print $2}' | sed 's|refs/tags/||' | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "no tags published yet"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current="$(git -C packages/cube-prometheus describe --tags --always 2>/dev/null || echo none)"
          echo "latest=${latest} current=${current}"
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "already on ${latest}"
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the published package before opening a pull request
        if: steps.tag.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          export CUBE_VERSION="v${TAG#v}"
          export EXPORTER_PACKAGE_SOURCE=registry
          export EXPORTER_PACKAGE="cube-prometheus@${TAG#v}"
          git -C packages/cube-prometheus fetch --tags origin
          git -C packages/cube-prometheus checkout --detach "$TAG"
          (cd packages/cube-prometheus && npm ci --no-audit --no-fund)
          make tools
          git clone --depth 1 --branch "v${TAG#v}" https://github.com/cube-js/cube.git /tmp/cube
          CUBE_REPO=/tmp/cube make test
          make e2e
          set -o pipefail
          make grafana | tee /tmp/grafana.log
          grep -Eq '^RESULT passed=[0-9]+ failed=0$' /tmp/grafana.log || {
            echo "::error::Grafana verification did not report a clean result"
            tail -30 /tmp/grafana.log
            exit 1
          }

      - name: Open a pull request with the bumped pointer
        if: steps.tag.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          branch="chore/package-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C packages/cube-prometheus fetch --tags origin
          git -C packages/cube-prometheus checkout --detach "$TAG"
          git checkout -B "$branch"
          git add packages/cube-prometheus
          git commit -m "chore: bump cube-prometheus to ${TAG}"
          # Owned by this workflow and rebuilt from main on every run.
          git push --force origin "$branch"

          cat > /tmp/pr.md <<EOF
          Bumps \`packages/cube-prometheus\` to \`${TAG}\`.

          Verified in the workflow run that opened this pull request, against the
          **published** tarball (\`EXPORTER_PACKAGE=cube-prometheus@${TAG#v}\`):

          - unit tests for the exporter
          - the event-name contract against \`cubejs/cube:${TAG}\`
          - chart render and rule validation
          - end-to-end against a real Cube and Postgres
          - every dashboard panel queried through Grafana

          Merge when the review looks right; the suite has already run.
          EOF

          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --body-file /tmp/pr.md
            echo "updated pull request for ${branch}"
          else
            gh pr create --base main --head "$branch" \
              --title "chore: bump cube-prometheus to ${TAG}" --body-file /tmp/pr.md
            echo "opened pull request for ${branch}"
          fi

      - name: Merge the verified pointer bump
        if: steps.tag.outputs.update == 'true' && vars.AUTO_RELEASE != 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          branch="chore/package-${TAG}"

          # The pointer bump must be the only change; anything else needs a human.
          git fetch --quiet origin main
          changed="$(git diff --name-only "origin/main...HEAD" | sort)"
          unexpected="$(printf '%s\n' "$changed" | grep -vE '^packages/cube-prometheus$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::refusing to auto-merge: unexpected files in the sync branch"
            echo "$unexpected"
            exit 1
          fi

          gh pr merge "$branch" --squash --delete-branch
          echo "merged the pointer bump to ${TAG}"

      - name: Note when auto-release is disabled
        if: steps.tag.outputs.update == 'true' && vars.AUTO_RELEASE == 'false'
        run: echo "AUTO_RELEASE is false — pull request left open for review"

