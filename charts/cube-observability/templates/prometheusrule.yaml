{{- if .Values.alerts.enabled }}
{{- /*
Rules are generated by tools/gen.mjs from the metric catalog, so no series name is
spelled here. Only the namespace is templated, because the rules are cluster-scoped
selectors over this release's pods.
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "cube-observability.name" . }}
  namespace: {{ include "cube-observability.namespace" . }}
  labels:
    {{- include "cube-observability.labels" . | nindent 4 }}
    {{- with .Values.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
{{ .Files.Get "files/rules.yml" | replace "__NAMESPACE__" (include "cube-observability.namespace" .) | indent 4 }}
{{- end }}
