{{- if .Values.scrape.api.serviceMonitor.enabled }}
{{- /*
Alternative to the PodMonitor for deployments that already expose the metrics port on a
Service with a named port. Off by default: it requires that port to exist, which most
Cube charts do not provide.
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "cube-observability.name" . }}-api
  namespace: {{ include "cube-observability.namespace" . }}
  labels:
    {{- include "cube-observability.labels" . | nindent 4 }}
    {{- with .Values.scrape.api.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "cube-observability.namespace" . }}
  selector:
    matchLabels:
      {{- include "cube-observability.matchLabels" (list . .Values.cube.apiComponentLabel) | nindent 6 }}
  endpoints:
    - port: {{ .Values.scrape.api.serviceMonitor.portName }}
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.scrape.api.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.scrape.api.serviceMonitor.scrapeTimeout }}
{{- end }}
