{{- if .Values.scrape.api.podMonitor.enabled }}
{{- /*
Scrapes the API pods directly on the exporter port.

`targetPort` is used deliberately: it lets the monitor reach a port that is neither
declared as a containerPort nor exposed on a Service, which is what makes this chart a
drop-in alongside any Cube chart instead of a fork of it.
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "cube-observability.name" . }}-api
  namespace: {{ include "cube-observability.namespace" . }}
  labels:
    {{- include "cube-observability.labels" . | nindent 4 }}
    {{- with .Values.scrape.api.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "cube-observability.namespace" . }}
  selector:
    matchLabels:
      {{- include "cube-observability.matchLabels" (list . .Values.cube.apiComponentLabel) | nindent 6 }}
  podMetricsEndpoints:
    - targetPort: {{ .Values.metrics.port }}
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.scrape.api.podMonitor.interval }}
      scrapeTimeout: {{ .Values.scrape.api.podMonitor.scrapeTimeout }}
{{- end }}
