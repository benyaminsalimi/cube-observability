# Generated by tools/gen.mjs. Do not edit by hand.
  - name: cube-observability
    rules:
      - alert: CubeApiMetricsMissing
        expr: 'absent(cube_build_info{namespace="__NAMESPACE__"})'
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No Cube API pod is reporting metrics: either the deployment is down or the exporter stopped."
          runbook: docs/operations.md
      - alert: CubeApiErrorRatioHigh
        expr: 'sum(rate(cube_requests_total{status="error"}[5m])) / clamp_min(sum(rate(cube_requests_total[5m])), 1e-9) > 0.05'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than the configured share of Cube API requests are failing."
          runbook: docs/operations.md
      - alert: CubeApiLatencyHigh
        expr: 'histogram_quantile(0.95, sum by (le) (rate(cube_request_duration_seconds_bucket[5m]))) > 10'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 Cube API latency is above the configured budget."
          runbook: docs/operations.md
      - alert: CubeQueuePressureHigh
        expr: 'sum(rate(cube_events_total{event="Continue wait"}[5m])) / clamp_min(sum(rate(cube_events_total{event="Load Request"}[5m])), 1e-9) > 0.2'
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A large share of load requests are answering \"Continue wait\": the deployment is under-provisioned or the data source is slow."
          runbook: docs/operations.md
      - alert: CubeRefreshSchedulerStale
        expr: 'absent(cube_events_total{event="Refresh Scheduler Run", namespace="__NAMESPACE__"})'
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "The refresh worker has not reported a scheduler run: pre-aggregations are not being refreshed."
          runbook: docs/operations.md
      - alert: CubePreaggregationBuildFailures
        expr: 'increase(cube_preaggregation_builds_total{status="error"}[15m]) > 0'
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "A pre-aggregation build failed in the last 15 minutes."
          runbook: docs/operations.md
      - alert: CubeTelemetryUnmappedEvents
        expr: 'increase(cube_telemetry_unmapped_events_total[1h]) > 0'
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Cube emitted event names the exporter does not know: the metric contract needs updating for this Cube version."
          runbook: docs/operations.md
